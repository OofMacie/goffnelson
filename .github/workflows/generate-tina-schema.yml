# One-off maintenance workflow: TinaCloud requires the generated schema lock.
# This runs on the Tina repair branch and commits only tina/tina-lock.json.
name: Generate Tina schema lock

on:
  push:
    branches: [fix/tinacms-cloud-connection]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Tina schema via local dev
        shell: bash
        run: |
          set -euo pipefail
          # Official Tina docs: tina-lock.json is generated by tina dev, not build.
          timeout 80s npm run dev > /tmp/tinacms-local.log 2>&1 || status=$?
          if [ ! -s tina/tina-lock.json ]; then
            echo "::error::Tina did not generate tina/tina-lock.json"
            tail -120 /tmp/tinacms-local.log
            exit 1
          fi
          echo "Successfully generated Tina schema lock"
      - name: Commit generated schema lock to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tina/tina-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(tina): commit generated schema lock for TinaCloud indexing"
            git push origin HEAD:fix/tinacms-cloud-connection
          else
            echo "Schema lock is already current."
          fi
