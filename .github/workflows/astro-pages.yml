# Build Astro rather than sending its source files to Jekyll.
# Repository Settings > Pages > Source must be GitHub Actions.
# This publishes only the static public site; Tina's server endpoint remains on Vercel.
name: Astro GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_BRANCH: main
      PUBLIC_TINA_CLIENT_ID: ${{ vars.PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate library content
        run: npm run content:check
      - name: Build Astro and TinaCMS
        run: npm run build
      - name: Verify static publishing directory
        shell: bash
        run: |
          set -euo pipefail
          output=.vercel/output/static
          test -s "$output/index.html"
          test -d "$output/_astro"
          if [[ ! -s "$output/Events/index.html" && ! -s "$output/Events.html" ]]; then
            echo "::error::The built Events page is missing."
            exit 1
          fi
          trustees="$output/BoardofTrustees/index.html"
          if [[ ! -s "$trustees" ]]; then trustees="$output/BoardofTrustees.html"; fi
          test -s "$trustees"
          grep -Fq 'Welcome to the Board of Trustees' "$trustees"
          # The local-only Tina editor cannot authenticate on a hosted site.
          if [[ -z "$PUBLIC_TINA_CLIENT_ID" || -z "$TINA_TOKEN" ]]; then
            rm -rf "$output/admin"
            echo "::notice::Publishing public pages only; TinaCloud credentials are not configured for Actions."
          else
            echo "::notice::The Tina forms may work, but GitHub Pages cannot serve the live visual-preview endpoint."
          fi
          touch "$output/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check site is hosted at the domain root
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ -n "$BASE_PATH" && "$BASE_PATH" != "/" ]]; then
            echo "::error::This site has root-relative assets and navigation. Configure a root-level custom domain before deploying, or adapt the site for the project subpath."
            exit 1
          fi
      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4
