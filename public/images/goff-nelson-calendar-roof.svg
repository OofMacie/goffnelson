<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" preserveAspectRatio="none" role="img" aria-label="Decorative roof and chimney outline based on Goff–Nelson Memorial Library">
  <!-- Original hand-authored illustration. Window beams are clipped to the glass:
       they meet the pitched roof and sill but never protrude beyond the window. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bbec1"/>
      <stop offset=".55" stop-color="#4c7980"/>
      <stop offset="1" stop-color="#29464a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b9188"/>
      <stop offset=".65" stop-color="#4e5a55"/>
      <stop offset="1" stop-color="#343e3a"/>
    </linearGradient>
    <clipPath id="window-interior">
      <path d="M0 174 L194 78 L1100 194 V210 H0 Z"/>
    </clipPath>
    <clipPath id="chimney-stones">
      <path d="M58 15 L162 17 L166 207 L56 207Z"/>
    </clipPath>
  </defs>

  <!-- A complete solid underlying wall: no off-white gaps beneath the left eave. -->
  <path d="M0 145 L192 60 L1100 177 V210 H0 Z" fill="#1b332c"/>

  <!-- Window glazing, touching its side walls and base. -->
  <path d="M0 174 L194 78 L1100 194 V210 H0Z" fill="url(#glass)"/>
  <g clip-path="url(#window-interior)">
    <!-- Continuous framed timber beam follows the sloping roof, within the window. -->
    <path d="M-10 170 L194 76 L1110 194" fill="none" stroke="#1a302b" stroke-width="15" stroke-linejoin="miter"/>
    <path d="M-10 174 L194 85 L1110 204" fill="none" stroke="#52746b" stroke-width="3" opacity=".7"/>

    <!-- Upper/bottom-anchored mullions. Clip makes each end meet the roof and sill cleanly. -->
    <g stroke="#3b3029" stroke-width="13">
      <path d="M234 65 V221 M401 67 V221 M570 70 V221 M743 75 V221 M920 85 V221"/>
    </g>
    <g stroke="#acccc8" stroke-width="2" opacity=".43">
      <path d="M245 65 V216 M414 65 V216 M583 65 V216 M756 65 V216 M934 65 V216"/>
    </g>

    <!-- Mid-window timber brace, ends trimmed by window's exact geometric boundary. -->
    <path d="M169 123 L1110 209" stroke="#2a2a25" stroke-width="17" fill="none"/>
    <path d="M169 119 L1110 205" stroke="#745740" stroke-width="10" fill="none"/>
    <path d="M169 115 L1110 201" stroke="#967254" stroke-width="2" opacity=".65" fill="none"/>
  </g>

  <!-- Roof above window: trim matches the same pitch on both sides of chimney. -->
  <path d="M0 147 L192 64 L1100 181" stroke="#1b231e" stroke-width="26" stroke-linejoin="miter" fill="none"/>
  <path d="M0 141 L192 59 L1100 176" stroke="#62462f" stroke-width="16" stroke-linejoin="miter" fill="none"/>
  <path d="M0 138 L192 57 L1100 173" stroke="#b39767" stroke-width="3" stroke-linejoin="miter" fill="none" opacity=".85"/>
  <path d="M0 160 L192 82 L1100 198" stroke="#17332b" stroke-width="7" stroke-linejoin="miter" fill="none"/>

  <!-- Chimney in foreground masks timber, so no beam intrudes into the masonry. -->
  <path d="M58 15 L162 17 L166 207 L56 207Z" fill="url(#stone)" stroke="#2a3532" stroke-width="6"/>
  <path d="M49 12 L166 12 L166 23 L49 23Z" fill="#69756c" stroke="#26332e" stroke-width="3"/>
  <g clip-path="url(#chimney-stones)" stroke="#b0b6a9" stroke-opacity=".42" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M60 33 164 34 M58 50 164 52 M59 69 166 68 M58 88 164 89 M58 108 165 106 M56 125 165 127 M57 147 166 145 M56 166 167 167 M57 185 166 183"/>
    <path d="M83 23 83 34 M132 34 133 50 M86 52 87 69 M143 68 143 88 M86 89 87 108 M129 108 129 127 M85 127 84 145 M140 145 140 166 M93 166 94 185 M135 184 135 209"/>
  </g>
  <g clip-path="url(#chimney-stones)" stroke="#1d2c28" stroke-width="2" stroke-opacity=".4" fill="none">
    <path d="M76 37 100 38 M122 71 151 73 M64 116 83 115 M109 152 130 153 M73 175 91 177 M105 196 147 198"/>
  </g>

  <!-- Final horizontal window sill: top of the actual clickable calendar. -->
  <path d="M0 202 H1100" stroke="#372a21" stroke-width="15"/>
  <path d="M0 198 H1100" stroke="#bd9d5b" stroke-width="3" opacity=".72"/>
</svg>